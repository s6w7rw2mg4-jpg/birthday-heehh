<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday 🌸🐶</title>
<style>
body {
  background: #fff5f8;
  text-align: center;
  font-family: "Comic Sans MS", cursive;
  padding: 50px;
  overflow: hidden;
}

h1 {
  color: #d96c9a;
}

.puppy {
  font-size: 80px;
}

.message {
  background: white;
  border-radius: 20px;
  padding: 20px;
  max-width: 500px;
  margin: auto;
  box-shadow: 0 5px 15px #ffd1e3;
}

.petal {
  position: absolute;
  top: -20px;
  font-size: 25px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}
</style>
</head>

<body>

<h1>🌸 Happy Birthday, my love 🌸</h1>

<div class="puppy">🐶</div>

<div class="message">
<p>
hi my beautiful baby.
</p>

<p>
I made this tiny place just for you because you deserve
all the happiness in the world. 💗
</p>

<p>
Thank you for making the distance feel smaller.
I love you 🌸
</p>
</div>

<div class="petal">🌸</div>
<div class="petal" style="left:30%; animation-delay:2s;">🌸</div>
<div class="petal" style="left:70%; animation-delay:1s;">🌸</div>

</body>
</html>
